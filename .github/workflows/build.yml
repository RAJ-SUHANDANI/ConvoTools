name: Build and interaction checks

on:
  push:
    branches: [main, redesign]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: convotools-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Resolve updated dependency lockfile
        if: github.ref == 'refs/heads/redesign'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Persist resolved versions on redesign only
        if: github.ref == 'refs/heads/redesign'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(deps): regenerate reproducible lockfile [skip ci]"
            git push origin HEAD:redesign
          fi
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint source
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile flows
        run: npm run test:e2e
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
